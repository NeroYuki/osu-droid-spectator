<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Match History</title>
        <link rel="icon" href="./icon.png" />
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: #1a1a2e;
                color: #e0e0e0;
                min-height: 100vh;
                padding: 24px 16px;
            }

            header {
                margin: 0 0 24px;
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }

            header h1 {
                font-size: 1.5rem;
                font-weight: 700;
                color: #ff79c6;
                flex: 1 1 auto;
            }

            .search-bar {
                display: flex;
                gap: 8px;
            }

            .search-bar input {
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #444;
                background: #16213e;
                color: #e0e0e0;
                font-size: 0.95rem;
                width: 140px;
            }

            .search-bar input:focus { outline: 2px solid #ff79c6; border-color: transparent; }

            .search-bar button {
                padding: 8px 18px;
                border-radius: 6px;
                border: none;
                background: #ff79c6;
                color: #1a1a2e;
                font-weight: 700;
                cursor: pointer;
                font-size: 0.95rem;
                transition: background 0.15s;
            }

            .search-bar button:hover { background: #ffa0d8; }
            .search-bar button:disabled { background: #555; color: #999; cursor: not-allowed; }

            #status {
                margin: 0 0 16px;
                font-size: 0.9rem;
                color: #aaa;
                min-height: 22px;
            }

            #status.error { color: #ff5555; }

            #result {}

            .room-name {
                font-size: 1.6rem;
                font-weight: 700;
                margin-bottom: 20px;
                color: #cdd6f4;
            }

            .session-card {
                background: #16213e;
                border-radius: 10px;
                padding: 18px 20px;
                margin-bottom: 20px;
                border: 1px solid #2a2a4a;
            }

            .session-header {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: flex-start;
                margin-bottom: 14px;
            }

            .session-map {
                font-size: 1.05rem;
                font-weight: 600;
                color: #cdd6f4;
                flex: 1;
            }

            .session-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }

            .badge {
                font-size: 0.75rem;
                padding: 3px 9px;
                border-radius: 99px;
                font-weight: 600;
                background: #2a2a4a;
                color: #a0a8d0;
            }

            .badge.wc { background: #2d1b4e; color: #bd93f9; }
            .badge.tm { background: #1b3040; color: #8be9fd; }
            .badge.rl { background: #1b3020; color: #50fa7b; }

            .session-time {
                font-size: 0.8rem;
                color: #888;
                width: 100%;
            }

            /* Team VS layout */
            .teams-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            @media (max-width: 640px) { .teams-container { grid-template-columns: 1fr; } }

            .team-block { border-radius: 8px; overflow: hidden; }
            .team-block.red { border: 1px solid #ff5555; }
            .team-block.blue { border: 1px solid #5599ff; }
            .team-block.winner-red { box-shadow: 0 0 10px #ff555566; }
            .team-block.winner-blue { box-shadow: 0 0 10px #5599ff66; }

            .team-title {
                padding: 8px 12px;
                font-weight: 700;
                font-size: 0.9rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .team-title.red { background: #3a1a1a; color: #ff5555; }
            .team-title.blue { background: #1a1a3a; color: #5599ff; }

            .team-title .winner-crown { color: #f1fa8c; margin-right: 4px; }

            /* Score table */
            .score-table-wrapper { overflow-x: auto; }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.82rem;
            }

            thead tr { background: #0f1929; }

            th {
                padding: 7px 10px;
                text-align: left;
                color: #888;
                font-weight: 600;
                white-space: nowrap;
                border-bottom: 1px solid #2a2a4a;
            }

            td {
                padding: 7px 10px;
                border-bottom: 1px solid #1e2a40;
                white-space: nowrap;
            }

            tr:last-child td { border-bottom: none; }

            td.rank { color: #f1fa8c; font-weight: 700; width: 28px; }
            td.player { color: #cdd6f4; font-weight: 600; }
            td.score-val { color: #ffb86c; }
            td.accuracy { color: #50fa7b; }
            td.combo { color: #8be9fd; }
            td.mods { color: #bd93f9; font-style: italic; }
            td.dead { opacity: 0.45; }

            .no-scores { color: #666; font-size: 0.88rem; padding: 10px 0; text-align: center; }
        </style>
    </head>
    <body>
        <header>
            <h1>Match History</h1>
            <div class="search-bar">
                <input id="room-id-input" type="number" min="1" placeholder="Room ID" />
                <button id="search-btn">Load</button>
            </div>
        </header>
        <div id="status"></div>
        <div id="result" hidden></div>

        <script>
            // ── Enums (mirrored from multi-server-node) ──────────────────────
            const WinCondition = { scoreV1: 0, accuracy: 1, maxCombo: 2, scoreV2: 3 };
            const TeamMode     = { headToHead: 0, teamVS: 1 };
            const Team         = { red: 0, blue: 1 };

            const WIN_CONDITION_LABELS = ["Score V1", "Accuracy", "Max Combo", "Score V2"];

            // ── Helpers ───────────────────────────────────────────────────────
            function sortKey(wc) {
                return wc === WinCondition.accuracy ? "accuracy"
                     : wc === WinCondition.maxCombo  ? "maxCombo"
                     : "score";
            }

            function sortScores(scores, wc) {
                const key = sortKey(wc);
                return [...scores].sort((a, b) => b[key] - a[key]);
            }

            function teamMetric(scores, wc) {
                if (scores.length === 0) return 0;
                const key = sortKey(wc);
                const sum = scores.reduce((s, p) => s + p[key], 0);
                return wc === WinCondition.accuracy ? sum / scores.length : sum;
            }

            function fmtScore(n)    { return Number(n).toLocaleString(); }
            function fmtAcc(a)      { return (a * 100).toFixed(2) + "%"; }
            function fmtMods(mods)  { return mods && mods.length ? mods.map(m => m.acronym).join(",") : "—"; }
            function fmtDate(iso)   { return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); }
            function esc(s)         { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

            // ── Score table (shared for h2h and per-team) ────────────────────
            function buildScoreTable(scores, wc) {
                if (scores.length === 0) return '<p class="no-scores">No scores recorded.</p>';

                const sorted = sortScores(scores, wc);
                const rows = sorted.map((s, i) => {
                    const tdCls = s.isAlive ? "" : " dead";
                    return `<tr class="${tdCls}">
                        <td class="rank">#${i + 1}</td>
                        <td class="player">${esc(s.userName)}</td>
                        <td class="score-val">${fmtScore(s.score)}</td>
                        <td class="accuracy">${fmtAcc(s.accuracy)}</td>
                        <td class="combo">${fmtScore(s.maxCombo)}x</td>
                        <td>${s.hit300}</td>
                        <td>${s.hit100}</td>
                        <td>${s.hit50}</td>
                        <td>${s.hit0}</td>
                        <td class="mods">${esc(fmtMods(s.playMod))}</td>
                    </tr>`;
                }).join("");

                return `<div class="score-table-wrapper"><table>
                    <thead><tr>
                        <th>#</th><th>Player</th><th>Score</th><th>Accuracy</th>
                        <th>Combo</th><th>300</th><th>100</th><th>50</th><th>Miss</th><th>Mods</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table></div>`;
            }

            // ── Session card ─────────────────────────────────────────────────
            function buildSession(session, index) {
                const wc      = session.winCondition;
                const isTeamVS = session.teamMode === TeamMode.teamVS;
                const wcLabel  = WIN_CONDITION_LABELS[wc] ?? `WC${wc}`;
                const sliderBadge = session.removeSliderLock
                    ? '<span class="badge rl">No Slider Lock</span>' : "";

                let scoresHtml;

                if (isTeamVS) {
                    const red  = session.scores.filter(s => s.team === Team.red);
                    const blue = session.scores.filter(s => s.team === Team.blue);

                    const redMetric  = teamMetric(red,  wc);
                    const blueMetric = teamMetric(blue, wc);
                    const redWins    = redMetric > blueMetric;
                    const blueWins   = blueMetric > redMetric;

                    const redAggregate  = wc === WinCondition.accuracy ? fmtAcc(redMetric)  : fmtScore(redMetric);
                    const blueAggregate = wc === WinCondition.accuracy ? fmtAcc(blueMetric) : fmtScore(blueMetric);

                    scoresHtml = `<div class="teams-container">
                        <div class="team-block red${redWins ? " winner-red" : ""}">
                            <div class="team-title red">
                                <span>${redWins ? '<span class="winner-crown">&#9733;</span>' : ""}Red Team</span>
                                <span>${redAggregate}</span>
                            </div>
                            ${buildScoreTable(red, wc)}
                        </div>
                        <div class="team-block blue${blueWins ? " winner-blue" : ""}">
                            <div class="team-title blue">
                                <span>${blueWins ? '<span class="winner-crown">&#9733;</span>' : ""}Blue Team</span>
                                <span>${blueAggregate}</span>
                            </div>
                            ${buildScoreTable(blue, wc)}
                        </div>
                    </div>`;
                } else {
                    scoresHtml = buildScoreTable(session.scores, wc);
                }

                return `<div class="session-card">
                    <div class="session-header">
                        <span class="session-map">${esc(session.mapName)}</span>
                        <div class="session-meta">
                            <span class="badge wc">${esc(wcLabel)}</span>
                            <span class="badge tm">${isTeamVS ? "Team VS" : "Head-to-Head"}</span>
                            ${sliderBadge}
                        </div>
                        <span class="session-time">${fmtDate(session.startTime)}</span>
                    </div>
                    ${scoresHtml}
                </div>`;
            }

            // ── Render ────────────────────────────────────────────────────────
            function render(data) {
                const result = document.getElementById("result");

                if (!data || Array.isArray(data) || !data.sessions) {
                    result.hidden = true;
                    setStatus("Room not found.", true);
                    return;
                }

                const sessionsHtml = data.sessions.length === 0
                    ? '<p class="no-scores">No sessions recorded for this room yet.</p>'
                    : data.sessions.map((s, i) => buildSession(s, i)).join("");

                result.innerHTML = `
                    <h2 class="room-name">${esc(data.name)}</h2>
                    ${sessionsHtml}`;
                result.hidden = false;
            }

            // ── Fetch ─────────────────────────────────────────────────────────
            async function loadRoom(id) {
                const btn = document.getElementById("search-btn");
                btn.disabled = true;
                setStatus("Loading…");
                document.getElementById("result").hidden = true;

                try {
                    const res = await fetch(`/api/tournament/getrooms_history?id=${encodeURIComponent(id)}`);
                    if (!res.ok) {
                        setStatus(`Server returned ${res.status}.`, true);
                        return;
                    }
                    const data = await res.json();
                    setStatus("");
                    render(data);
                } catch (e) {
                    setStatus("Failed to load: " + e.message, true);
                } finally {
                    btn.disabled = false;
                }
            }

            function setStatus(msg, isError = false) {
                const el = document.getElementById("status");
                el.textContent = msg;
                el.className = isError ? "error" : "";
            }

            // ── Init ──────────────────────────────────────────────────────────
            const input = document.getElementById("room-id-input");
            const btn   = document.getElementById("search-btn");

            btn.addEventListener("click", () => {
                const id = input.value.trim();
                if (!id) return;
                const url = new URL(location.href);
                url.searchParams.set("id", id);
                history.replaceState(null, "", url);
                loadRoom(id);
            });

            input.addEventListener("keydown", e => {
                if (e.key === "Enter") btn.click();
            });

            // Auto-load from URL param on page open
            const paramId = new URLSearchParams(location.search).get("id");
            if (paramId) {
                input.value = paramId;
                loadRoom(paramId);
            }
        </script>
    </body>
</html>
